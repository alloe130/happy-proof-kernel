[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "happy-proof-kernel"
version = "0.1.0a1"
description = "A durable Git handoff kernel for independent AI clients"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
demo = [
    "mcp>=1.30.0,<2",
    "cryptography>=46.0.7,<51",
    "PyJWT>=2.12.1,<3",
    "uvicorn>=0.41,<1",
]
test = ["pytest>=8,<10"]

[project.scripts]
hpk-demo = "hpk_demo.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
